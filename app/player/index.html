<!doctype html>
<html lang="ko">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Local AI Music Studio</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#202623;background:#f4f5f1;font-size:15px}*{box-sizing:border-box}body{max-width:1100px;margin:auto;padding:32px 24px}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px}h1{font-size:25px;letter-spacing:-.7px;margin:0}h2{font-size:18px;margin:0 0 14px}p{line-height:1.6}.muted{color:#627069;font-size:13px}.badge{background:#e4eee5;color:#385a42;border-radius:20px;padding:7px 12px;font-size:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{background:white;border:1px solid #dce2db;border-radius:12px;padding:22px;margin-bottom:18px}label{display:block;font-size:13px;font-weight:600;margin:14px 0 7px}textarea,input,select{font:inherit;padding:10px;border:1px solid #cbd5ca;border-radius:6px;background:#fcfdfb;width:100%}textarea{height:100px;resize:vertical}button{font:inherit;border:1px solid #c4cec3;border-radius:6px;background:#f8faf5;color:#26382b;padding:10px 14px;cursor:pointer}button.primary{background:#375b43;color:white;border-color:#375b43}button:disabled{opacity:.5;cursor:wait}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #9ac5a7;outline-offset:2px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.row button{flex:initial}audio{width:100%;margin-top:12px}.path{font-size:11px;overflow-wrap:anywhere;color:#6c776d;margin:10px 0}.notice{min-height:28px;padding:8px 0;font-size:14px;white-space:pre-wrap;color:#344c3c}.error{color:#a03828}pre{font-size:12px;white-space:pre-wrap;word-break:break-word;background:#f6f8f3;padding:14px;border-radius:7px;max-height:330px;overflow:auto}summary{cursor:pointer;font-size:13px;color:#4b6151}#jobs{font-size:13px;line-height:1.7}.empty{color:#758074;padding:20px 0}footer{color:#788276;font-size:12px;margin-top:10px}@media(max-width:700px){.grid{grid-template-columns:1fr}body{padding:20px 14px}header{gap:12px;align-items:start}.card{padding:16px}}
</style>
<header><div><h1>Local AI Music Studio</h1><p class="muted">프롬프트로 만들고, 듣고, 다듬기.</p></div><span class="badge">LOCAL · PHASE 1</span></header>
<div class="grid">
<section class="card"><h2>음악 생성</h2><label for="prompt">어떤 음악을 만들까요?</label><textarea id="prompt">90년대 트립합 느낌의 어두운 음악. 85BPM, 묵직한 드럼과 깊은 베이스, 몽환적인 신스. 보컬 없는 30초 음악.</textarea><div class="row"><div><label for="duration">길이</label><select id="duration"><option value="30">30초</option><option value="15">15초</option></select></div><div><label for="seed">시드</label><input id="seed" type="number" value="42" min="0" max="4294967295"></div></div><div class="row" style="margin-top:16px"><button class="primary" id="generate">음악 생성</button><span class="muted">로컬 모델 · 한 번에 1곡</span></div></section>
<section class="card"><h2>자연어로 다듬기</h2><p class="muted">아래 A 버전의 전체 믹스에 적용합니다. 원본은 보존됩니다.</p><label for="instruction">수정 요청</label><textarea id="instruction">베이스를 좀 더 묵직하게 만들어줘.</textarea><div class="row" style="margin-top:16px"><button class="primary" id="produce">수정본 만들기</button><button id="dream">몽환적으로</button></div><p class="muted">멜로디·악기 교체에는 재생성이나 별도 스템이 필요합니다.</p></section>
</div>
<div id="notice" class="notice" role="status" aria-live="polite"></div>
<section class="card"><div class="row"><h2 style="flex:1">듣고 비교하기</h2><button id="refresh">새로 고침</button></div><div class="grid"><div><label for="a">A · 기준 버전</label><select id="a" aria-label="A 기준 버전"></select><audio id="audioA" controls preload="metadata"></audio><div id="pathA" class="path"></div><button id="listenA">같은 위치에서 A 재생</button></div><div><label for="b">B · 비교 버전</label><select id="b" aria-label="B 비교 버전"></select><audio id="audioB" controls preload="metadata"></audio><div id="pathB" class="path"></div><button id="listenB">같은 위치에서 B 재생</button></div></div><div class="row" style="margin-top:18px"><button id="compare">분석 비교</button><button id="restore">A 버전으로 복원</button><button id="export">A를 WAV로 내보내기</button></div><pre id="comparison" hidden></pre><details style="margin-top:18px"><summary>A 프롬프트 · 효과 이력</summary><pre id="history"></pre></details></section>
<section class="card"><h2>생성 작업</h2><div id="jobs" class="empty">상태를 불러오는 중…</div></section>
<footer>외부 음악 생성 API 없이 실행됩니다. 생성 품질은 직접 듣고 평가해 주세요.</footer>
<script>
const $=id=>document.getElementById(id);let state={versions:[]};let busy=false;
function notify(message,error=false){$('notice').textContent=message;$('notice').classList.toggle('error',error)}
async function request(url,body){const response=await fetch(url,body?{method:'POST',headers:{'Content-Type':'application/json','X-Studio-Request':'1'},body:JSON.stringify(body)}:{});const data=await response.json();if(!response.ok)throw Error(typeof data.error==='string'?data.error:JSON.stringify(data.detail||data));return data}
function current(which){return state.versions.find(v=>v.id===$(which).value)}
function label(v){const meta=v.metadata;const title=meta.kind==='generation'?(meta.plan.original_prompt.slice(0,44)):meta.kind==='dsp'?(meta.instruction||'DSP 수정본'):'가져온 오디오';return `${v.id===state.current_version?'● ':''}${title} · ${v.id.slice(0,6)}`}
function select(which){const v=current(which);const upper=which.toUpperCase(),audio=$('audio'+upper);const src=v?'/audio/'+v.id:'';if(audio.getAttribute('src')!==src){audio.pause();if(src)audio.src=src;else audio.removeAttribute('src');audio.load()}$('path'+upper).textContent=v?v.path:'아직 음악이 없습니다. 첫 곡을 생성해 주세요.';if(which==='a')$('history').textContent=v?JSON.stringify(v.metadata,null,2):''}
async function refresh(prefer){const previousA=$('a').value,previousB=$('b').value;state=await request('/api/state');for(const which of ['a','b']){const selectBox=$(which);selectBox.replaceChildren();for(const v of state.versions){const option=document.createElement('option');option.value=v.id;option.textContent=label(v);selectBox.append(option)}let wanted=which==='a'?previousA:prefer||previousB;if(state.versions.some(v=>v.id===wanted))selectBox.value=wanted;else if(which==='a'&&state.current_version)selectBox.value=state.current_version;select(which)}const active=state.jobs.some(j=>['queued','running'].includes(j.state));$('generate').disabled=active||busy||!state.generation_ready;$('generate').title=state.generation_ready?'':'모델 설치를 마친 뒤 생성할 수 있습니다.';for(const id of ['compare','restore','export','listenA','listenB'])$(id).disabled=!state.versions.length||busy;$('produce').disabled=!state.versions.length||busy;$('jobs').replaceChildren();if(!state.jobs.length)$('jobs').textContent='진행 중인 생성 작업이 없습니다.';for(const job of state.jobs.slice(0,6)){const line=document.createElement('div');line.textContent=`${job.id.slice(0,8)} · ${job.state} · ${job.request.original_prompt.slice(0,55)}${job.error?' · '+job.error.split('\n')[0]:''}`;$('jobs').append(line)}}
async function action(button,fn){if(busy)return;busy=true;button.disabled=true;try{await fn()}catch(error){notify(error.message,true)}finally{busy=false;button.disabled=false;await refresh().catch(error=>notify(error.message,true))}}
$('generate').onclick=()=>action($('generate'),async()=>{const result=await request('/api/generate',{prompt:$('prompt').value,duration:Number($('duration').value),seed:Number($('seed').value)});notify(`생성 시작 · ${result.id}\n완료되면 재생 목록에 추가됩니다.`)});
$('produce').onclick=()=>action($('produce'),async()=>{const result=await request('/api/produce',{version_id:$('a').value,instruction:$('instruction').value});if(!result.applied){notify(result.plan.message,true);return}await refresh(result.version.id);notify('수정본을 B에 추가했습니다. A/B를 비교해 보세요.')});
$('dream').onclick=()=>{$('instruction').value='조금 더 몽환적으로 만들어줘.'};
$('refresh').onclick=()=>refresh().catch(e=>notify(e.message,true));$('a').onchange=()=>select('a');$('b').onchange=()=>select('b');
for(const which of ['A','B']){$('listen'+which).onclick=async()=>{const target=$('audio'+which),other=$('audio'+(which==='A'?'B':'A'));const position=!other.paused?other.currentTime:target.currentTime;other.pause();target.currentTime=Math.min(position,Math.max(0,target.duration-.01)||0);try{await target.play()}catch(e){notify(e.message,true)}};$('audio'+which).onplay=()=>$('audio'+(which==='A'?'B':'A')).pause()}
$('compare').onclick=()=>action($('compare'),async()=>{const result=await request('/api/compare?original_id='+encodeURIComponent($('a').value)+'&modified_id='+encodeURIComponent($('b').value));$('comparison').hidden=false;$('comparison').textContent=JSON.stringify(result,null,2)});
$('restore').onclick=()=>action($('restore'),async()=>{await request('/api/restore',{version_id:$('a').value});notify('현재 버전을 A로 복원했습니다. 다른 버전도 보존됩니다.')});
$('export').onclick=()=>action($('export'),async()=>{const result=await request('/api/export',{version_id:$('a').value});notify('WAV 저장 완료\n'+result.path)});
refresh().catch(e=>notify(e.message,true));setInterval(()=>{if(!busy)refresh().catch(e=>notify(e.message,true))},5000);
</script></html>
